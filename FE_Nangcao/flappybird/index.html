<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Bird – Phạm Tiến Hưng</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game">
        <div id="level">Level 1</div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
        <div id="bird"></div>
        <div id="toast"></div>
        <div id="panel" class="show">
            <h1>Flappy Bird</h1>
            <p id="panel-msg">Nhấn phím <b>↓ (Arrow Down)</b> để bay lên</p>
            <p class="hint">Space: chơi • P: tạm dừng</p>
            <button id="start">Bắt đầu</button>
        </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
